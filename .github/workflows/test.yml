name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: python -m pip install -e .
      - name: Run normal unit tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import unittest

          loader = unittest.TestLoader()
          suite = unittest.TestSuite()
          for path in sorted(Path("tests").glob("test_*.py")):
              if path.name != "test_large_book.py":
                  suite.addTests(loader.discover("tests", pattern=path.name))

          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(not result.wasSuccessful())
          PY

  large_book_paths:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      core_changed: ${{ steps.core-paths.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check large-book core paths
        id: core-paths
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            src/private_translate/core/ \
            src/private_translate/formats/ \
            src/private_translate/languages/ \
            pyproject.toml \
            tests/test_large_book.py; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  large-book-regression:
    needs: large_book_paths
    if: >-
      ${{
        always() &&
        (
          github.event_name == 'workflow_dispatch' ||
          (
            github.event_name == 'push' &&
            github.ref == 'refs/heads/main' &&
            needs.large_book_paths.outputs.core_changed == 'true'
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p test_large_book.py -v

  epubcheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y pandoc epubcheck
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p test_epubcheck.py -v
